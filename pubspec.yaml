name: flutter_kaiyaletz
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.4.3
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^3.0.0
  connectivity_plus: ^7.3.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  json_annotation: ^4.12.0
  pinput: ^6.0.2
  image_picker: ^1.2.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.13.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/app_logo_bg.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/img/
    - assets/icons/

  fonts:
    # Headings / titles
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600

    # Body, labels, buttons, inputs, captions
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
